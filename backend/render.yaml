services:
  - type: web
    name: patavida-api
    runtime: python
    plan: free
    region: ohio  # misma región que la base de datos de Neon (AWS us-east-2)
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/categorias/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CLINICA_DEMO_PASSWORD
        sync: false
      # Envío de fórmulas por correo (API de Brevo; Render gratis bloquea SMTP)
      - key: BREVO_API_KEY
        sync: false
      - key: CORREO_REMITENTE
        sync: false
      - key: CORREO_REMITENTE_NOMBRE
        value: PataVida Clínica Veterinaria
